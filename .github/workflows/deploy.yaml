      #   if: ${{ inputs.service_to_deploy == 'all' || inputs.service_to_deploy == matrix.service }}
      #   run: |
      #     restate deployments register "https://${{ matrix.service }}-1053905202146.us-central1.run.app" -e ${{ env.PROJECT_ENV }}